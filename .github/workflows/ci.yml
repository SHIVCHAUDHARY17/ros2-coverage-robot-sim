name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libgtest-dev
      - name: Configure and build
        run: cmake -S src/coverage_core -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  docker-colcon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image (runs colcon build)
        run: docker build -t nozzle-coverage-robot .
      - name: Unit tests in container (GoogleTest + pytest)
        run: docker run --rm nozzle-coverage-robot
      - name: Headless simulation with sensor faults (must reach 99 % coverage)
        run: >
          docker run --rm -v "${{ github.workspace }}/outputs:/ws/outputs"
          nozzle-coverage-robot bash scripts/run_scenario.sh site_faults 99
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report-site_faults
          path: |
            outputs/reports/
            outputs/launch.log
          if-no-files-found: warn